# adjudicate/policy.yaml — starter policy for node 5 (policy_adjudicate).
#
# Pure config: no model call ever reads or writes this file at runtime, only
# policy_adjudicate.py's rule matcher does. Rules are checked top to bottom;
# the first rule whose `when` clause matches the VLM's structured evidence
# wins. A `when` clause with only `axis` matches any confidence for that
# axis. `default_action` is the safety net if nothing matches -- it should
# never fire in practice while the taxonomy stays locked to category/
# structural, but a rules layer that can't be silent about an unmatched case
# is the whole point of keeping this config-driven.
#
# Rationale (see FAILURES.md for the drift/ validation this policy is built
# on, and for the boat-lifestyle.com finding that changed the structural
# rule below):
#   - category + high confidence: the VLM is confident this is a real
#     category shift -- flag it for review now, don't wait on a human to
#     re-derive what the model already saw clearly.
#   - category + medium/low confidence: plausible category drift but the
#     VLM itself isn't sure -- send to a human rather than have either the
#     model or a hardcoded default decide alone.
#   - structural, any confidence: NOT auto-approved. Originally was --
#     "structural" was validated in FAILURES.md as the low-risk axis
#     (redesign, same business) using human-labeled ground truth. But the
#     end-to-end test on boat-lifestyle.com (a real, hand-labeled
#     category-drift pair: audio-only -> broad consumer electronics/
#     wearables/corporate gifting) had the VLM call it "structural" at
#     high confidence, disagreeing with the human label -- see FAILURES.md.
#     An axis label the VLM itself can get wrong on a real case is not
#     something this policy auto-approves on; route to a human instead.
#     approve is left unused by any rule below rather than deleted, so the
#     policy is explicit that this action exists and was deliberately
#     stopped being reachable, not forgotten.

rules:
  - when: {axis: category, confidence: high}
    action: flag_for_review

  - when: {axis: category, confidence: medium}
    action: escalate_further

  - when: {axis: category, confidence: low}
    action: escalate_further

  - when: {axis: structural}
    action: flag_for_review

default_action: escalate_further

# Fires when structure_output.py (node 4) could not obtain evidence to
# adjudicate at all -- the VLM call failed outright (both attempts, see
# vlm_evidence.py's retry), or its response never validated against the
# evidence schema. This is NOT `default_action`: default_action means "we
# have evidence, but no rule above matched it"; this means "we have no
# evidence to rule-match in the first place." Distinct action so an audit
# trail can tell "the model answered ambiguously" apart from "the model
# didn't produce a usable answer at all." Mandatory human review, never
# approve, never silently dropped -- see FAILURES.md for the real gap this
# closed (a parse failure used to raise an uncaught exception with no
# logged action).
parse_failure_action: needs_manual_review
