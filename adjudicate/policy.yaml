# adjudicate/policy.yaml — starter policy for node 5 (policy_adjudicate).
#
# Pure config: no model call ever reads or writes this file at runtime, only
# policy_adjudicate.py's rule matcher does. Rules are checked top to bottom;
# the first rule whose `when` clause matches the VLM's structured evidence
# wins. A `when` clause with only `axis` matches any confidence for that
# axis. `default_action` is the safety net if nothing matches -- it should
# never fire in practice while the taxonomy stays locked to category/
# structural, but a rules layer that can't be silent about an unmatched case
# is the whole point of keeping this config-driven.
#
# Rationale (see FAILURES.md for the drift/ validation this policy is built
# on):
#   - category + high confidence: the VLM is confident this is a real
#     category shift -- flag it for review now, don't wait on a human to
#     re-derive what the model already saw clearly.
#   - category + medium/low confidence: plausible category drift but the
#     VLM itself isn't sure -- send to a human rather than have either the
#     model or a hardcoded default decide alone.
#   - structural, any confidence: validated as the low-risk axis (redesign,
#     same business) -- approve regardless of how confident the VLM is that
#     it's structural, since even a mildly-confident "structural" is not a
#     risk signal by definition of the locked taxonomy.

rules:
  - when: {axis: category, confidence: high}
    action: flag_for_review

  - when: {axis: category, confidence: medium}
    action: escalate_further

  - when: {axis: category, confidence: low}
    action: escalate_further

  - when: {axis: structural}
    action: approve

default_action: escalate_further
