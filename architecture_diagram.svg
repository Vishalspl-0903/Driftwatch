<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 560" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1520" height="560" fill="#ffffff"/>

  <text x="30" y="30" font-size="15" font-weight="bold" fill="#111827">Driftwatch pipeline</text>
  <text x="30" y="50" font-size="12" fill="#6b7280">deterministic scoring first — a model is only called on the ambiguous middle, and never decides the action</text>

  <!-- arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Stage 1: MINE -->
  <g>
    <rect x="20" y="90" width="230" height="120" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="135" y="125" font-size="18" font-weight="bold" fill="#334155" text-anchor="middle">MINE</text>
    <text x="135" y="150" font-size="11.5" fill="#475569" text-anchor="middle">Wayback CDX +</text>
    <text x="135" y="166" font-size="11.5" fill="#475569" text-anchor="middle">Playwright</text>
    <text x="135" y="188" font-size="11" fill="#64748b" text-anchor="middle">→ t0/t1 snapshot pairs</text>
  </g>

  <line x1="250" y1="150" x2="298" y2="150" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: SCORE -->
  <g>
    <rect x="300" y="90" width="230" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="415" y="125" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">SCORE</text>
    <text x="415" y="150" font-size="11.5" fill="#1e40af" text-anchor="middle">CLIP catalog-centroid</text>
    <text x="415" y="166" font-size="11.5" fill="#1e40af" text-anchor="middle">cosine distance</text>
    <text x="415" y="188" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">deterministic — no LLM</text>
  </g>

  <line x1="530" y1="150" x2="578" y2="150" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: ROUTE -->
  <g>
    <rect x="580" y="90" width="230" height="120" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="695" y="125" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">ROUTE</text>
    <text x="695" y="150" font-size="11.5" fill="#5b21b6" text-anchor="middle">escalation_check</text>
    <text x="695" y="169" font-size="10.5" fill="#6d28d9" text-anchor="middle">no_action / auto_flag /</text>
    <text x="695" y="184" font-size="10.5" fill="#6d28d9" text-anchor="middle">escalated</text>
  </g>

  <!-- branch down: deterministic outcomes -->
  <line x1="695" y1="210" x2="695" y2="270" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="555" y="272" width="280" height="70" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="695" y="298" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="middle">no_action / auto_flag / insufficient_data</text>
  <text x="695" y="316" font-size="10.5" fill="#6b7280" text-anchor="middle">action taken directly — no LLM call</text>
  <text x="695" y="332" font-size="10.5" fill="#6b7280" text-anchor="middle">2/3 pairs in this sample</text>

  <!-- branch right: escalated -->
  <line x1="810" y1="150" x2="878" y2="150" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="844" y="130" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">escalated</text>
  <text x="844" y="176" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">1/3 (33%)</text>
  <text x="844" y="190" font-size="9.5" fill="#92400e" text-anchor="middle">n=3 real pairs</text>

  <!-- Stage 4: ESCALATE -->
  <g>
    <rect x="880" y="90" width="290" height="150" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="1025" y="125" font-size="18" font-weight="bold" fill="#92400e" text-anchor="middle">ESCALATE</text>
    <text x="1025" y="146" font-size="10.5" fill="#92400e" text-anchor="middle" font-style="italic">only the ambiguous middle reaches here</text>
    <text x="1025" y="167" font-size="11" fill="#78350f" text-anchor="middle">fetch_context → vlm_evidence</text>
    <text x="1025" y="184" font-size="11" fill="#78350f" text-anchor="middle">→ structure_output</text>
    <text x="1025" y="205" font-size="10.5" font-weight="bold" fill="#b45309" text-anchor="middle">Groq qwen/qwen3.6-27b</text>
    <text x="1025" y="221" font-size="10" fill="#92400e" text-anchor="middle">the only node that calls a model</text>
  </g>

  <line x1="1170" y1="165" x2="1218" y2="165" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 5: ADJUDICATE -->
  <g>
    <rect x="1220" y="90" width="270" height="150" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="1355" y="125" font-size="18" font-weight="bold" fill="#065f46" text-anchor="middle">ADJUDICATE</text>
    <text x="1355" y="149" font-size="11" fill="#065f46" text-anchor="middle">YAML policy layer decides</text>
    <text x="1355" y="165" font-size="11" fill="#065f46" text-anchor="middle">the final action</text>
    <text x="1355" y="187" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">the model never decides</text>
    <text x="1355" y="203" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">directly</text>
  </g>

  <!-- terminal -->
  <line x1="1355" y1="240" x2="1355" y2="270" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1255" y="272" width="200" height="46" rx="8" fill="#111827"/>
  <text x="1355" y="300" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">final action</text>

  <!-- callout: the real finding -->
  <rect x="900" y="400" width="590" height="150" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="920" y="428" font-size="12.5" font-weight="bold" fill="#9a3412">Policy note (added after a real failure, not a hypothetical)</text>
  <text x="920" y="452" font-size="12" fill="#7c2d12">Structural verdicts route to review, not auto-approve —</text>
  <text x="920" y="472" font-size="12" fill="#7c2d12">added after a real VLM disagreement with hand-labeled</text>
  <text x="920" y="492" font-size="12" fill="#7c2d12">ground truth on boat-lifestyle.com (VLM said "structural,</text>
  <text x="920" y="512" font-size="12" fill="#7c2d12">high confidence"; ground truth said category drift).</text>
  <text x="920" y="536" font-size="11.5" font-style="italic" fill="#c2410c">See FAILURES.md.</text>

  <!-- callout: reliability caveat -->
  <rect x="20" y="400" width="850" height="90" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="40" y="426" font-size="12.5" font-weight="bold" fill="#334155">Read as a real, small-sample result — not a benchmark</text>
  <text x="40" y="448" font-size="11.5" fill="#475569">Detector validation: precision 1.00, recall 0.67 on n=10. VLM structured-output reliability: 2/6 successful parses (33%).</text>
  <text x="40" y="468" font-size="11.5" fill="#475569">Full numbers and methodology in README.md's Metrics section and FAILURES.md.</text>
</svg>
